<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>தமிழ் கீதை — வருகை பதிவு</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@500;700;900&family=Mukta+Malar:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1F2B;
    --maroon-deep:#571620;
    --gold:#C9A227;
    --cream:#FBF3E7;
    --ink:#2B1A12;
    --ink-soft:#5A463B;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(201,162,39,0.18), transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:'Mukta Malar', 'Noto Sans Tamil', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .card{width:100%;max-width:460px;text-align:center;}
  .motif{width:56px;height:56px;margin:0 auto 18px;color:var(--maroon);}
  h1{
    font-family:'Catamaran', 'Noto Sans Tamil', sans-serif;
    font-weight:900;
    font-size:clamp(1.9rem, 7vw, 2.7rem);
    margin:0 0 6px;
    color:var(--maroon-deep);
    line-height:1.15;
  }
  .rule{width:56px;height:3px;background:var(--gold);margin:14px auto 18px;border-radius:2px;}
  p.lede{font-size:1.05rem;line-height:1.65;color:var(--ink-soft);margin:0 auto 28px;max-width:38ch;}

  form{text-align:left;}
  .field{margin-bottom:18px;}
  label, .legend{
    display:block;
    font-size:0.95rem;
    font-weight:600;
    color:var(--maroon-deep);
    margin:0 0 6px;
  }
  .req{color:var(--maroon);}
  input[type=text], input[type=number], input[type=date], select{
    width:100%;
    padding:13px 14px;
    border:2px solid #E4D6BE;
    border-radius:12px;
    font-family:inherit;
    font-size:1rem;
    background:#fff;
    color:var(--ink);
    transition:border-color 0.15s ease;
  }
  input:focus, select:focus{outline:none;border-color:var(--gold);}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choices input{position:absolute;opacity:0;pointer-events:none;}
  .choices label{
    margin:0;
    text-align:center;
    padding:12px 8px;
    border:2px solid #E4D6BE;
    border-radius:12px;
    background:#fff;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .choices input:checked + label{
    background:var(--maroon);
    border-color:var(--maroon);
    color:var(--cream);
  }
  .choices input:focus-visible + label{outline:3px solid var(--gold);outline-offset:2px;}

  button{
    width:100%;
    margin-top:6px;
    background:var(--maroon);
    color:var(--cream);
    border:none;
    font-family:'Catamaran', sans-serif;
    font-weight:700;
    font-size:1.1rem;
    padding:15px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(122,31,43,0.28);
    transition:transform 0.18s ease, background 0.18s ease;
  }
  button:hover{background:var(--maroon-deep);transform:translateY(-2px);}
  button:active{transform:translateY(0);}
  button:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}

  #status{margin-top:16px;font-size:0.95rem;min-height:1.3em;color:var(--maroon);}

  .success-view{display:none;}
  .success-view svg{width:56px;height:56px;color:#3E6B3A;margin:0 auto 14px;}
  .success-view h2{font-family:'Catamaran', sans-serif;font-weight:700;font-size:1.5rem;color:var(--maroon-deep);margin:0 0 8px;}
  .success-view p{color:var(--ink-soft);margin:0 0 22px;}
  .again{
    display:inline-block;width:auto;padding:12px 28px;font-size:1rem;
    background:transparent;color:var(--maroon);border:2px solid var(--maroon);box-shadow:none;
  }
  .again:hover{background:var(--maroon);color:var(--cream);}

  @media (prefers-reduced-motion: reduce){ button, .choices label{transition:none;} }
</style>
</head>
<body>
  <div class="card">

    <div id="formView">
      <svg class="motif" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 6C24 16 24 26 32 32C40 26 40 16 32 6Z" fill="currentColor" opacity="0.9"/>
        <path d="M32 32C22 34 14 42 14 52C14 54 15 55 17 54C24 50 28 44 32 40C36 44 40 50 47 54C49 55 50 54 50 52C50 42 42 34 32 32Z" fill="currentColor" opacity="0.55"/>
      </svg>
      <h1>தமிழ் கீதை</h1>
      <div class="rule"></div>
      <p class="lede">ஒவ்வொரு தமிழ் கீதை புது பாடலை பாடிய பின் இதில் உங்கள் வருகையை பதிவு செய்து விடுங்கள்.</p>

      <form id="attendanceForm">
        <div class="field">
          <label for="name">பெயர் <span class="req">*</span></label>
          <input id="name" type="text" required autocomplete="name" placeholder="உங்கள் பெயர்">
        </div>

        <div class="field">
          <label for="songNo">தமிழ் கீதை பாடல் எண் <span class="req">*</span></label>
          <input id="songNo" type="number" inputmode="numeric" min="1" required placeholder="எ.கா. 12">
        </div>

        <div class="field">
          <label for="songDate">பாடிய தேதி <span class="req">*</span></label>
          <input id="songDate" type="date" required>
        </div>

        <div class="field">
          <span class="legend">Category <span class="req">*</span></span>
          <div class="choices">
            <input type="radio" name="category" id="c1" value="மாணவர்" required><label for="c1">மாணவர்</label>
            <input type="radio" name="category" id="c2" value="ஆசிரியர்"><label for="c2">ஆசிரியர்</label>
            <input type="radio" name="category" id="c3" value="இல்லத்தரசி"><label for="c3">இல்லத்தரசி</label>
            <input type="radio" name="category" id="c4" value="பெரியோர்கள்"><label for="c4">பெரியோர்கள்</label>
          </div>
        </div>

        <div class="field">
          <label for="group">Group name <span class="req">*</span></label>
          <select id="group" required>
            <option value="தமிழ் கீதை படிக்கலாம் வாங்க 1">தமிழ் கீதை படிக்கலாம் வாங்க 1</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">வருகை பதிவு செய்ய</button>
        <div id="status" role="status"></div>
      </form>
    </div>

    <div class="success-view" id="successView">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2>நன்றி!</h2>
      <p>உங்கள் வருகை பதிவு செய்யப்பட்டது.</p>
      <button type="button" class="again" id="againBtn">மற்றொரு பதிவு</button>
    </div>

  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-cdSgkywRddDUYoqxcSassIjZ-Fb6dTzdz8khornhtX9oy0Qbud8d7-2A-5_W2ImF/exec";

  const form = document.getElementById('attendanceForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const dateEl = document.getElementById('songDate');

  function setToday(){
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    dateEl.value = d.toISOString().slice(0,10);
  }
  setToday();

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    statusEl.textContent = '';

    const payload = {
      name: document.getElementById('name').value.trim(),
      songNo: document.getElementById('songNo').value.trim(),
      songDate: dateEl.value,
      category: (form.querySelector('input[name=category]:checked') || {}).value || '',
      group: document.getElementById('group').value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'பதிவு செய்யப்படுகிறது...';

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch (err) {
      statusEl.textContent = 'பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'வருகை பதிவு செய்ய';
    }
  });

  document.getElementById('againBtn').addEventListener('click', function(){
    form.reset();
    setToday();
    submitBtn.disabled = false;
    submitBtn.textContent = 'வருகை பதிவு செய்ய';
    document.getElementById('successView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
  });
</script>
</body>
</html>
